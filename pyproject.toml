[project]
name = "invoice-processor"
version = "0.1.0"
description = "PyQt6 proof of concept for grid-based invoice line-item extraction from OCR'd PDFs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PyQt6>=6.7.0",
    "pymupdf>=1.24.0",
]

[project.scripts]
invoice-processor = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["invoice_app"]
force-include = { "main.py" = "main.py" }
